<title id="t">Furkan Fidan: full-stack, mobile and network engineer, open to roles</title>
<desc id="d">Animated topology. Furkan Fidan is the controller node, linked to web and mobile tools (React, TypeScript, Flutter), backend and data tools (Node.js, Python, PostgreSQL, Docker) and network tools (Ryu, OpenFlow, Mininet). Banner: open to roles in full-stack, mobile and network/SDN engineering.</desc>
