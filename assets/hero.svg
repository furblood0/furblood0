<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 420" width="1000" height="420" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title id="t">Furkan Fidan as an SDN controller node connected to his stack</title>
<desc id="d">An animated network topology. The controller node "furkan" sits in the center and sends amber packets to React, Flutter, TypeScript, Docker, Python, Node.js, Spring Boot and PostgreSQL. Status: active, open to roles.</desc>
<style>
