 @keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}
 .ring{animation:ring 3s ease-out infinite;transform-origin:500px 200px}
 @keyframes ring{0%{transform:scale(1);opacity:.5}100%{transform:scale(1.5);opacity:0}}
 @media (prefers-reduced-motion:reduce){.led,.ring{animation:none}}
</style>
